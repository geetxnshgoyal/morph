# Generate Morph.xcodeproj with: cd ios && xcodegen
name: Morph
options:
  bundleIdPrefix: app.morph
  deploymentTarget:
    iOS: "17.0"
packages:
  Morph:
    path: ..
# One version for the app and its share sheet; the App Store requires them to match.
settings:
  base:
    MARKETING_VERSION: 1.0.3
    CURRENT_PROJECT_VERSION: 10
targets:
  Morph:
    type: application
    platform: iOS
    sources:
      - path: Morph
      # One copy of the loader, kept with the Mac app.
      - path: ../Sources/MorphMac/MorphLoader.swift
    dependencies:
      - package: Morph
        product: MorphCore
      - target: MorphShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.morph.Morph
        PRODUCT_NAME: Morph
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 675A56FHGZ
    info:
      path: Morph/Info.plist
      properties:
        CFBundleDisplayName: Morph
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Results live in Documents, which the Files app shows under "On My iPhone → Morph".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSPhotoLibraryAddUsageDescription: Morph saves the photos and videos you convert to your library.
        # Morph uses no encryption of its own, so App Store Connect needs no export compliance paperwork.
        ITSAppUsesNonExemptEncryption: false
        # Press and hold the app icon.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.morph.photos
            UIApplicationShortcutItemTitle: Convert Photos
            UIApplicationShortcutItemSubtitle: Pick from your library
            UIApplicationShortcutItemIconSymbolName: photo.on.rectangle.angled
          - UIApplicationShortcutItemType: app.morph.files
            UIApplicationShortcutItemTitle: Choose Files
            UIApplicationShortcutItemSubtitle: From iCloud Drive or your iPhone
            UIApplicationShortcutItemIconSymbolName: folder
        # Puts Morph in every share sheet ("Open in Morph").
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.content, public.data]
  # Morph in the share sheet: the actions sheet over the app the share came from.
  MorphShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Morph/ActionsView.swift
      - path: Morph/Theme.swift
      - path: ../Sources/MorphMac/MorphLoader.swift
    dependencies:
      - package: Morph
        product: MorphCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.morph.Morph.Share
        PRODUCT_NAME: MorphShare
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 675A56FHGZ
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Morph
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: Morph saves the photos and videos you convert to your library.
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 50
